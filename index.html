:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a18; --surface:#1d2522; --ink:#e7ece8; --muted:#9aa8a1; --line:#2e3a35;

:root[data-theme="dark"]{
  --bg:#141a18; --surface:#1d2522; --ink:#e7ece8; --muted:#9aa8a1; --line:#2e3a35;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
.brand h1{display:flex;align-items:center;gap:8px}
.logo{width:30px;height:30px;border-radius:7px;image-rendering:pixelated}

[hidden]{display:none!important}

.stripe{grid-row:1/span 3;border-radius:2px;background:var(--c)}
.card[data-c="melee"],.card[data-c="攻擊"],.card[data-c="負面"]{--c:var(--melee)} .card[data-c="ranged"],.card[data-c="防禦"]{--c:var(--ranged)} .card[data-c="armor"],.card[data-c="輔助"],.card[data-c="正面"]{--c:var(--armor)}

.ico.none::after{content:"⚡";font-size:24px}

.name{min-width:0;align-self:center}

dl{grid-column:2/-1;margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px}

dd{margin:0;min-width:0}
.pct{font-family:var(--f-display);font-size:12px;color:var(--unique)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.foot{color:var(--muted);font-size:12.5px;line-height:1.6}
.foot a{color:inherit}
.ext{color:var(--ranged);text-decoration:none;font-weight:500}

</div></main>
